{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href= "{% static 'myapp/logIn.css' %}">
    <title>Python</title>
</head>
<body>
    <header>
        <h1>PyLearn</h1>
    </header>
    <main>
        <div class="log_in">
            <h3>LogIn</h3>
            <div class="margin" id="login-flow"
                 data-request-url="{% url 'login' %}"
                 data-verify-url="{% url 'verify_login_otp' %}">
                <form id="login-form">
                    <input id="email" type="email" placeholder="you@email.com" required>
                    <button type="submit" id="btn">Send login code</button>
                </form>
                <form id="verify-login-form" hidden>
                    <label for="code">Enter the 6-digit code emailed to you</label>
                    <input id="code" inputmode="numeric" autocomplete="one-time-code"
                           pattern="[0-9]{6}" maxlength="6" required>
                    <button type="submit" id="verify-btn">Verify and log in</button>
                </form>
                <p id="error" role="status" aria-live="polite"></p>
            </div>
        </div>

        <div class="sign_in">
            <p>Don't have an account?</p>
            <a href="{% url 'signin' %}">Sign In</a>
        </div>
    </main>

    <footer>
        PyLearn Tutorial
    </footer>

    <script src="{% static 'myapp/logIn.js' %}"></script>
</body>
</html>
