{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'myapp/sendCode.css' %}">
    <title>SendCode</title>
  </head>
  <body>
    <header>
      <h1>PyLearn</h1>
    </header>
    <main>
      <h3>Sign Up</h3>
      <div class="text">
        <h4>Verify your email</h4>
        <p class="">We've sent a 6-digit verification code to your email</p>

        <div class="otp-boxes">
          <div class="box box-1"></div>
          <div class="box box-2"></div>
          <div class="box box-3"></div>
          <div class="box box-4"></div>
          <div class="box box-5"></div>
          <div class="box box-6"></div>
        </div>

        <p class="question">Didn't receive the code? Resend Otp</p>

        <button type="button">Verify Otp</button>
      </div>
    </main>
    <footer>
      <p>PyLearn Tutorial</p>
    </footer>
  </body>
</html>
