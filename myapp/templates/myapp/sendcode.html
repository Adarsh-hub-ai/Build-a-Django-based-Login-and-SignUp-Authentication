{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'myapp/sendCode.css' %}">
    <title>SendCode</title>
  </head>
  <body>
    <header>
      <h1>PyLearn</h1>
    </header>
    <main>
      <h3>Sign Up</h3>
      <div class="text">
        <h4>Verify your email</h4>
        <p>Enter the 6-digit code sent to your email.</p>
        <form id="verify-form" data-verify-url="{% url 'verify_otp' %}" data-resend-url="{% url 'send_otp' %}" data-login-url="{% url 'login' %}">
          <label for="otp-code">Verification code</label>
          <input id="otp-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required />
          <button type="submit">Verify code</button>
          <button id="resend-code" type="button">Resend code</button>
        </form>
        <p id="verify-message" role="status" aria-live="polite"></p>
      </div>
    </main>
    <footer>
      <p>PyLearn Tutorial</p>
    </footer>
    <script src="{% static 'myapp/sendCode.js' %}"></script>
  </body>
</html>
