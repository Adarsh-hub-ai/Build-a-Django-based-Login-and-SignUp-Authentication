{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href= "{% static 'myapp/signIn.css' %}">
    <title>Python</title>
  </head>
  <body>
    <header>
      <h1>PyLearn</h1>
    </header>

    <main>
      <div class="sign_up">
        <h1>Sign Up</h1>
        <form id="signup-form" data-send-code-url="{% url 'send_otp' %}" data-code-page-url="{% url 'sendotp' %}">
          <div class="margin">
            <div>
              <input type="text" id="name" name="name" placeholder="Your Name" maxlength="250" required />
            </div>

            <div>
              <input type="email" id="email" name="email" placeholder="you@gmail.com" maxlength="250" required />
            </div>

            <div class="btn" id="btn">
              <button type="submit">Send Code</button>
            </div>
          </div>
        </form>
        <p id="signup-message" role="alert" aria-live="polite"></p>

        <div class="text">
          <p>Already have an account?</p>
          <a href= "{% url 'login' %}">LogIn</a>
        </div>
      </div>
    </main>

    <footer>PyLearn Tutorial</footer>

    <script src="{% static 'myapp/signIn.js' %}"></script>
  </body>
</html>
